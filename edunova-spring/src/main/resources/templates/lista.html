<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EduNova - Lista</title>
</head>
<body>
    <h1>Centro de Capacitación EduNova</h1>
    <h2>Lista de Participantes Registrados</h2>
    <p>Total de participantes: <strong th:text="${totalParticipantes}">0</strong></p>

    <table border="1">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Correo electrónico</th>
                <th>Teléfono</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${participantes}">
                <td th:text="${p.nombre}">Nombre</td>
                <td th:text="${p.correo}">Correo</td>
                <td th:text="${p.telefono}">Teléfono</td>
            </tr>
        </tbody>
    </table>
    <br>
    <a th:href="@{/participantes/nuevo}">Registrar otro participante</a>
</body>
</html>
