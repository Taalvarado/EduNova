<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>EduNova - Registro</title>
</head>
<body>
    <h1>Centro de Capacitación EduNova</h1>
    <h2>Registro de Nuevo Participante</h2>

    <form th:action="@{/participantes}" th:object="${participante}" method="post">
        <div>
            <label>Nombre completo:</label>
            <input type="text" th:field="*{nombre}" required />
        </div>
        <div>
            <label>Curso:</label>
            <input type="text" th:field="*{curso}" required />
        </div>
        <div>
            <label>Teléfono:</label>
            <input type="text" th:field="*{telefono}" required />
        </div>
        <button type="submit">Guardar Participante</button>
    </form>
    <br>
    <a th:href="@{/participantes}">Ver lista de participantes</a>
</body>
</html>
